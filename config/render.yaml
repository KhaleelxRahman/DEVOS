# Render blueprint for the DEVOS v1.0.0 FastAPI backend.
# Secrets (AUTH_SECRET, DATABASE_URL, API keys) are marked sync:false — set
# them in the Render dashboard, never in Git.
services:
  - type: web
    name: devos-api
    runtime: python
    rootDir: 03-backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false   # Supabase/Postgres DSN (postgresql+asyncpg://...)
      - key: AUTH_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false   # Set to the final frontend origin in Render.
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: FRONTEND_APP_URL
        sync: false   # Set to the final frontend origin in Render.

  # Frontend static site (Vite build -> dist/).
  # NOTE: the currently live frontend service (devos-eh2p) was created outside
  # this blueprint; Render will not adopt it. Either re-create the frontend
  # from this blueprint or apply the same settings manually in the dashboard.
  - type: web
    name: devos-web
    runtime: static
    rootDir: 02-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: serve index.html for client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to the final backend URL ending in /api/v1.
      - key: VITE_SITE_URL
        sync: false   # Set to the final owned frontend origin for sitemap URLs.